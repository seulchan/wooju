[project]
name = "brain-core"
version = "0.1.0"
description = "Wooju Brain domain core: Markdown reader, record model, index, and relationships."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
