[project]
name = "brain-core"
version = "0.4.0"
description = "Wooju Brain domain core: Markdown reader, record model, index, and relationships."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "dulwich>=0.22",  # git in pure Python: users never install git
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
wooju-validate = "brain_core.validate:main"
