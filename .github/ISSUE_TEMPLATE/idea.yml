name: Idea or request
description: Something Wooju could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you were trying to do
      description: The situation and what got in the way. A concrete example beats a feature name.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
