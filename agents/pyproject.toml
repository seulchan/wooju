[project]
name = "wooju-agents"
version = "0.4.0"
description = "Wooju agents: AI provider layer and the Ingest agent. Agents only create proposals."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "brain-core",
    "httpx>=0.27",
    "pypdf>=4",
]

[tool.uv.sources]
brain-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wooju_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
