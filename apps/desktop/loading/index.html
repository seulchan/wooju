<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wooju</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: #0f1115; color: #e6e9ef;
        font-family: -apple-system, system-ui, sans-serif;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #58a6ff; animation: pulse 1.2s infinite; }
      @keyframes pulse { 50% { opacity: 0.25; } }
      p { color: #9aa4b2; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="dot" aria-hidden="true"></div>
    <p id="msg">Getting Wooju ready…</p>
    <script>
      // Follow the Mac's language, like the rest of the app.
      if ((navigator.language || '').toLowerCase().startsWith('ko')) {
        document.documentElement.lang = 'ko'
        document.getElementById('msg').textContent = 'Wooju를 준비하고 있어요…'
      }
    </script>
  </body>
</html>
