<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Wooju Brain UI — inspect a local Brain without changing it</title>
  <desc id="desc">A dark project-native overview showing Markdown notes flowing into a read-only in-memory index and four Home questions: what is known, what changed, what is connected, and what needs attention.</desc>

  <rect width="1200" height="420" rx="24" fill="#0f1115"/>
  <path d="M650 44V376" stroke="#2a2f3a" stroke-width="1"/>
  <path d="M56 284H604" stroke="#2a2f3a" stroke-width="1"/>

  <g id="identity" transform="translate(56 50)">
    <text x="0" y="0" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.5">LOCAL-FIRST / READ-ONLY / LIVE REFRESH</text>
    <text x="0" y="76" fill="#e6e9ef" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="750" letter-spacing="-2">Wooju Brain UI</text>
    <text x="0" y="130" fill="#e6e9ef" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="500">Inspect a local Brain without touching it.</text>
    <text x="0" y="169" fill="#9aa4b2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">Markdown → in-memory index → a four-question overview.</text>

    <g id="capabilities" transform="translate(0 223)">
      <rect x="0" y="0" width="112" height="42" rx="10" fill="#171a21" stroke="#2a2f3a"/>
      <circle cx="22" cy="21" r="6" fill="#58a6ff"/>
      <text x="38" y="27" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">BROWSE</text>

      <rect x="126" y="0" width="112" height="42" rx="10" fill="#171a21" stroke="#2a2f3a"/>
      <path d="M148 14l12 12M160 14l-12 12" stroke="#79c0ff" stroke-width="3" stroke-linecap="round"/>
      <text x="174" y="27" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">SEARCH</text>

      <rect x="252" y="0" width="112" height="42" rx="10" fill="#171a21" stroke="#2a2f3a"/>
      <polygon points="274,10 285,21 274,32 263,21" fill="#1f2430" stroke="#d29922" stroke-width="2"/>
      <text x="300" y="27" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">MAP</text>
    </g>
  </g>

  <g id="proof" transform="translate(684 44)">
    <text x="0" y="0" fill="#9aa4b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="1.2">THE BRAIN STAYS CANONICAL</text>

    <g id="brain-filesystem" transform="translate(0 28)">
      <rect x="0" y="0" width="190" height="250" rx="16" fill="#171a21" stroke="#2a2f3a"/>
      <text x="22" y="37" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">Brain/</text>
      <path d="M22 54H168" stroke="#2a2f3a"/>

      <circle cx="29" cy="83" r="6" fill="#58a6ff"/>
      <text x="48" y="89" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">wiki/*.md</text>
      <circle cx="29" cy="124" r="6" fill="#58a6ff"/>
      <text x="48" y="130" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">source.md</text>
      <polygon points="29,157 36,164 29,171 22,164" fill="#1f2430" stroke="#d29922" stroke-width="2"/>
      <text x="48" y="170" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">insight.md</text>
      <path d="M22 199H36M29 192V206" stroke="#79c0ff" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="205" fill="#9aa4b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">[[links]]</text>
    </g>

    <g id="index-and-questions" transform="translate(224 28)">
      <path d="M-30 105C-12 105 -8 73 0 73" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <path d="M-30 182C-12 182 -8 214 0 214" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M-2 73l-9 -5 2 10zM-2 214l-9 -5 2 10z" fill="#58a6ff"/>

      <rect x="0" y="0" width="236" height="92" rx="16" fill="#1f2430" stroke="#58a6ff" stroke-opacity=".55"/>
      <text x="20" y="31" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">READ-ONLY INDEX</text>
      <text x="20" y="58" fill="#9aa4b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">scan → publish</text>
      <circle cx="204" cy="68" r="7" fill="#3fb950"/>
      <text x="20" y="81" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">atomic snapshot</text>

      <text x="0" y="127" fill="#9aa4b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="1.1">HOME OVERVIEW</text>

      <g id="question-grid" transform="translate(0 146)">
        <rect x="0" y="0" width="111" height="64" rx="12" fill="#171a21" stroke="#2a2f3a"/>
        <circle cx="22" cy="22" r="7" fill="#58a6ff"/>
        <text x="38" y="28" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">KNOW</text>
        <text x="16" y="51" fill="#9aa4b2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">counts</text>

        <rect x="125" y="0" width="111" height="64" rx="12" fill="#171a21" stroke="#2a2f3a"/>
        <path d="M144 21h20M154 11v20" stroke="#79c0ff" stroke-width="3" stroke-linecap="round"/>
        <text x="174" y="28" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">DELTA</text>
        <text x="141" y="51" fill="#9aa4b2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">time ranges</text>

        <rect x="0" y="78" width="111" height="64" rx="12" fill="#171a21" stroke="#2a2f3a"/>
        <polygon points="22,89 31,98 22,107 13,98" fill="#1f2430" stroke="#d29922" stroke-width="2"/>
        <text x="38" y="104" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">MAP</text>
        <text x="16" y="129" fill="#9aa4b2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">links only</text>

        <rect x="125" y="78" width="111" height="64" rx="12" fill="#171a21" stroke="#2a2f3a"/>
        <circle cx="219" cy="94" r="7" fill="#d29922"/>
        <text x="141" y="104" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">REVIEW</text>
        <text x="141" y="129" fill="#9aa4b2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">open items</text>
      </g>
    </g>

    <text x="0" y="355" fill="#9aa4b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">watch → rescan → refresh · no restart required</text>
  </g>
</svg>
