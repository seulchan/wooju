<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500" viewBox="0 0 1200 500"
     role="img" aria-labelledby="model-title model-desc">
  <title id="model-title">The wooju-brain model: four canonical homes</title>
  <desc id="model-desc">Evidence, world knowledge, personal memory, and action context stay distinct while links carry context between them.</desc>

  <rect width="1200" height="500" rx="28" fill="#F4F1EA"/>

  <text x="56" y="58" fill="#69766D"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" font-weight="600" letter-spacing="1.8">THE MODEL / MEANING STAYS LOCAL</text>
  <text x="56" y="111" fill="#171B19"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="40" font-weight="720" letter-spacing="-1">Memory is not one bucket.</text>
  <text x="56" y="146" fill="#536057"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="21">Each canonical home answers a different question.</text>

  <path d="M56 186H1144" stroke="#D8D0C3" stroke-width="1"/>

  <g id="evidence-card">
    <rect x="56" y="214" width="256" height="194" rx="18" fill="#FFFDF8" stroke="#CEC7BA" stroke-width="1.5"/>
    <rect x="56" y="214" width="256" height="7" rx="3.5" fill="#E5A15F"/>
    <text x="78" y="254" fill="#C07C36"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="1.3">01 / EVIDENCE</text>
    <text x="78" y="294" fill="#171B19"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="27" font-weight="650">library/</text>
    <text x="78" y="322" fill="#536057"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20">→ sources/</text>
    <path d="M78 345H290" stroke="#D8D0C3"/>
    <text x="78" y="373" fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">What does this</text>
    <text x="78" y="397" fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">source support?</text>
  </g>

  <g id="world-card">
    <rect x="328" y="214" width="256" height="194" rx="18" fill="#FFFDF8" stroke="#CEC7BA" stroke-width="1.5"/>
    <rect x="328" y="214" width="256" height="7" rx="3.5" fill="#9BC4A4"/>
    <text x="350" y="254" fill="#4F8660"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="1.3">02 / WORLD KNOWLEDGE</text>
    <text x="350" y="294" fill="#171B19"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="27" font-weight="650">wiki/</text>
    <text x="350" y="322" fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20">synthesis</text>
    <path d="M350 345H562" stroke="#D8D0C3"/>
    <text x="350" y="373" fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">What do we</text>
    <text x="350" y="397" fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">understand now?</text>
  </g>

  <g id="personal-card">
    <rect x="600" y="214" width="256" height="194" rx="18" fill="#FFFDF8" stroke="#CEC7BA" stroke-width="1.5"/>
    <rect x="600" y="214" width="256" height="7" rx="3.5" fill="#8CB5D1"/>
    <text x="622" y="254" fill="#527B98"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="1.3">03 / PERSONAL MEMORY</text>
    <text x="622" y="294" fill="#171B19"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="27" font-weight="650">memory/</text>
    <text x="622" y="322" fill="#536057"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19">records · state</text>
    <path d="M622 345H834" stroke="#D8D0C3"/>
    <text x="622" y="373" fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">What is known</text>
    <text x="622" y="397" fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">about the user, and when?</text>
  </g>

  <g id="action-card">
    <rect x="872" y="214" width="256" height="194" rx="18" fill="#FFFDF8" stroke="#CEC7BA" stroke-width="1.5"/>
    <rect x="872" y="214" width="256" height="7" rx="3.5" fill="#D99778"/>
    <text x="894" y="254" fill="#A7644A"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="1.3">04 / ACTION CONTEXT</text>
    <text x="894" y="294" fill="#171B19"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="27" font-weight="650">projects/</text>
    <text x="894" y="322" fill="#536057"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20">+ areas/</text>
    <path d="M894 345H1106" stroke="#D8D0C3"/>
    <text x="894" y="373" fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">What is being</text>
    <text x="894" y="397" fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">done or managed?</text>
  </g>

  <path d="M56 448H1144" stroke="#D8D0C3" stroke-width="1"/>
  <circle cx="56" cy="448" r="4" fill="#E5A15F"/>
  <text x="72" y="455" fill="#69766D"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16">links carry context</text>
  <text x="1144" y="455" text-anchor="end" fill="#69766D"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16">boundaries preserve meaning</text>
</svg>
