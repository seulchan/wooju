<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="470" viewBox="0 0 1200 470"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">wooju-brain: what survives across runs</title>
  <desc id="hero-desc">A local-first memory boundary where inbox material is curated into evidence, world knowledge, personal memory, or action context.</desc>

  <rect width="1200" height="470" rx="28" fill="#101312"/>

  <g id="identity">
    <text x="56" y="58"
          fill="#E5A15F"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" font-weight="600" letter-spacing="2">LOCAL-FIRST / PERSONAL KNOWLEDGE + MEMORY</text>

    <text x="56" y="145"
          fill="#F3F0E8"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="68" font-weight="760" letter-spacing="-2">wooju-brain</text>
    <text x="56" y="194"
          fill="#F3F0E8"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="34" font-weight="680">what survives</text>
    <text x="56" y="235"
          fill="#F3F0E8"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="34" font-weight="680">across runs</text>

    <text x="56" y="286"
          fill="#C9D0C8"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="21">A durable memory boundary for humans and</text>
    <text x="56" y="317"
          fill="#C9D0C8"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="21">long-lived AI assistants.</text>

    <circle cx="56" cy="364" r="4" fill="#E5A15F"/>
    <text x="74" y="370"
          fill="#AEB8AF"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" letter-spacing="1">CAPTURE → CURATE → RETAIN</text>

    <path d="M56 401H602" stroke="#2A332E" stroke-width="1"/>
    <text x="56" y="430"
          fill="#77847B"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16">provenance · time · selective persistence</text>
  </g>

  <path d="M658 54V408" stroke="#2A332E" stroke-width="1"/>

  <g id="routing-map">
    <text x="700" y="58"
          fill="#88938B"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" font-weight="600" letter-spacing="1.8">ONE REPOSITORY / FOUR BOUNDARIES</text>

    <rect x="700" y="92" width="444" height="58" rx="16" fill="#19201C" stroke="#3A4640"/>
    <circle cx="726" cy="121" r="7" fill="#E5A15F"/>
    <text x="748" y="130"
          fill="#F3F0E8"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="23">inbox/</text>
    <text x="856" y="128"
          fill="#AEB8AF"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">unprocessed capture</text>

    <path d="M922 150V171M915 164L922 171L929 164" fill="none" stroke="#E5A15F" stroke-width="2"/>

    <g id="evidence-layer">
      <rect x="700" y="180" width="212" height="102" rx="16" fill="#19201C" stroke="#3A4640"/>
      <rect x="700" y="180" width="5" height="102" rx="2.5" fill="#E5A15F"/>
      <text x="724" y="211" fill="#E5A15F"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" letter-spacing="1.3">01 / EVIDENCE</text>
      <text x="724" y="245" fill="#F3F0E8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="23">library/</text>
      <text x="724" y="270" fill="#AEB8AF"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18">→ sources/</text>
    </g>

    <g id="world-layer">
      <rect x="932" y="180" width="212" height="102" rx="16" fill="#19201C" stroke="#3A4640"/>
      <rect x="932" y="180" width="5" height="102" rx="2.5" fill="#9BC4A4"/>
      <text x="956" y="211" fill="#9BC4A4"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" letter-spacing="1.3">02 / WORLD</text>
      <text x="956" y="245" fill="#F3F0E8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="23">wiki/</text>
      <text x="956" y="270" fill="#AEB8AF"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="18">synthesis</text>
    </g>

    <g id="personal-layer">
      <rect x="700" y="298" width="212" height="102" rx="16" fill="#19201C" stroke="#3A4640"/>
      <rect x="700" y="298" width="5" height="102" rx="2.5" fill="#8CB5D1"/>
      <text x="724" y="329" fill="#8CB5D1"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" letter-spacing="1.3">03 / PERSONAL</text>
      <text x="724" y="363" fill="#F3F0E8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="23">memory/</text>
      <text x="724" y="388" fill="#AEB8AF"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17">records · state</text>
    </g>

    <g id="action-layer">
      <rect x="932" y="298" width="212" height="102" rx="16" fill="#19201C" stroke="#3A4640"/>
      <rect x="932" y="298" width="5" height="102" rx="2.5" fill="#D99778"/>
      <text x="956" y="329" fill="#D99778"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" letter-spacing="1.3">04 / ACTION</text>
      <text x="956" y="363" fill="#F3F0E8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="23">projects/</text>
      <text x="956" y="388" fill="#AEB8AF"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18">+ areas/</text>
    </g>

    <circle cx="700" cy="430" r="4" fill="#E5A15F"/>
    <text x="718" y="436" fill="#AEB8AF"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16">separate meaning / preserve connection</text>
    <path d="M1036 430H1144" stroke="#2A332E" stroke-width="1"/>
  </g>
</svg>
