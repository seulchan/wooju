# Wooju monorepo: uv workspace root (virtual — not a package itself).

[tool.uv.workspace]
members = ["packages/brain-core", "apps/server"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures are Markdown/YAML literals; wrapping them hurts readability.
"**/tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["brain_core", "app"]
